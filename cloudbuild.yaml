steps:
  # Build the container image using the root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/finaxial-client'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_GEMINI_API_KEY=$_NEXT_PUBLIC_GEMINI_API_KEY'
      - '--build-arg'
      - 'NEXT_PUBLIC_GEMINI_API_KEY_1=$_NEXT_PUBLIC_GEMINI_API_KEY_1'
      - '--build-arg'
      - 'NEXT_PUBLIC_GEMINI_API_KEY_2=$_NEXT_PUBLIC_GEMINI_API_KEY_2'
      - '--build-arg'
      - 'NEXT_PUBLIC_GEMINI_API_KEY_3=$_NEXT_PUBLIC_GEMINI_API_KEY_3'
      - '--build-arg'
      - 'NEXT_PUBLIC_GEMINI_API_KEY_4=$_NEXT_PUBLIC_GEMINI_API_KEY_4'
      - '--build-arg'
      - 'NEXT_PUBLIC_GEMINI_API_KEY_5=$_NEXT_PUBLIC_GEMINI_API_KEY_5'
      - '.'
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/finaxial-client']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'finaxial-client'
      - '--image'
      - 'gcr.io/$PROJECT_ID/finaxial-client'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/finaxial-client'
